<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidu 数字人 OBS 纯净源 (全比例自适应)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* 默认透明，支持 OBS 场景混流 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            border: none;
            display: block;
        }
        /* 状态提示（只在未连上时显示，连上后自动消失，绝不污染直播） */
        #status-overlay {
            position: absolute;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            letter-spacing: 0.5px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 24px 36px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <div id="status-overlay">
            <div class="spinner"></div>
            <span id="status-text">正在连接局域网 Vidu 数字人推流通道...</span>
        </div>
    </div>

    <script>
        const videoEl = document.getElementById('remote-video');
        const statusOverlay = document.getElementById('status-overlay');
        const statusText = document.getElementById('status-text');

        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProto}//${location.host}/?role=obs`;

        let pc = null;
        let ws = null;
        let myClientId = null;
        let iceQueue = [];
        let inboundStream = null;

        function markStreamLive() {
            if (videoEl.videoWidth > 0) {
                statusOverlay.classList.add('hidden');
            }
        }

        videoEl.onloadedmetadata = () => {
            console.log(`[OBS] 视频元数据已加载！分辨率: ${videoEl.videoWidth}x${videoEl.videoHeight}`);
            markStreamLive();
        };

        videoEl.onplaying = () => {
            console.log('[OBS] 视频流已开始播放！');
            markStreamLive();
        };

        videoEl.ontimeupdate = () => {
            if (videoEl.currentTime > 0) {
                markStreamLive();
            }
        };

        function connectWS() {
            console.log(`[OBS] 正在连接中继 WebSocket: ${wsUrl}`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('[OBS] WebSocket 已经连接到局域网中继服务！');
                statusText.innerText = '已接入中继，等待数字人开播推流...';
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'init') {
                        myClientId = data.clientId;
                        console.log(`[OBS] 已分配唯一客户端识别码: [${myClientId}]`);
                    } else if (data.type === 'signal-offer') {
                        if (data.clientId && myClientId && data.clientId !== myClientId) {
                            return; // 忽略发往其他客户端的 offer
                        }
                        console.log('[OBS] 收到 WebRTC Offer，正在建立媒体连接...');
                        statusText.innerText = '正在握手建立音视频流...';
                        await handleOffer(data.offer);
                    } else if (data.type === 'signal-ice') {
                        if (data.clientId && myClientId && data.clientId !== myClientId) {
                            return;
                        }
                        if (data.candidate) {
                            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                                try {
                                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                                } catch(e) {
                                    console.warn('[OBS] 添加 ICE 异常:', e);
                                }
                            } else {
                                iceQueue.push(data.candidate);
                            }
                        }
                    }
                } catch (e) {
                    console.error('[OBS] 处理信令异常:', e);
                }
            };

            ws.onclose = () => {
                console.log('[OBS] WebSocket 断开，2.5秒后重连...');
                statusOverlay.classList.remove('hidden');
                statusText.innerText = '中继服务连接断开，正在尝试重连...';
                setTimeout(connectWS, 2500);
            };

            ws.onerror = (err) => {
                console.error('[OBS] WebSocket 错误:', err);
            };
        }

        async function handleOffer(offer) {
            if (pc) {
                try { pc.close(); } catch(e) {}
            }

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });
            window.pc = pc;
            iceQueue = [];
            inboundStream = new MediaStream();

            pc.ontrack = (event) => {
                console.log('[OBS] 成功接收媒体流轨道:', event.track.kind, event.track.label);
                inboundStream.addTrack(event.track);

                if (videoEl.srcObject !== inboundStream) {
                    videoEl.srcObject = inboundStream;
                }

                // 确保音频正常开启（不静音，供 OBS 采集声音）
                videoEl.muted = false;
                videoEl.volume = 1.0;
                videoEl.play().catch(e => {
                    console.warn('[OBS] 自动播放被拦截，先静音起播随后恢复音量:', e);
                    videoEl.muted = true;
                    videoEl.play().then(() => {
                        videoEl.muted = false;
                    });
                });

                markStreamLive();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'signal-ice',
                        clientId: myClientId,
                        candidate: event.candidate
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                console.log('[OBS] WebRTC 连接状态:', pc.connectionState);
                if (pc.connectionState === 'connected') {
                    statusText.innerText = '音视频流传输中...';
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            // 冲刷队列中的 ICE 候选地址
            for (const cand of iceQueue) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(cand));
                } catch(e) {}
            }
            iceQueue = [];

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'signal-answer',
                clientId: myClientId,
                answer: answer
            }));
            console.log('[OBS] 已向宿主发送 Answer，音视频流即将呈现');
        }

        connectWS();
    </script>
</body>
</html>
