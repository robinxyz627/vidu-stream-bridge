<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vidu 数字人 OBS 纯净源 (全比例自适应)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* 默认透明，支持 OBS 场景混流 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            border: none;
            display: block;
        }
        /* 状态提示（只在未连上时显示，连上后自动消失，绝不污染直播） */
        #status-overlay {
            position: absolute;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            letter-spacing: 0.5px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 24px 36px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* 应急安全审核大方块马赛克遮罩 */
        .safety-mask {
            position: absolute;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #060913;
        }
        .safety-mask.hidden {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        /* 经典几何大方块马赛克网格效果 */
        .safety-mask-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(45deg, #10192e 25%, transparent 25%), 
                linear-gradient(-45deg, #10192e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #10192e 75%), 
                linear-gradient(-45deg, transparent 75%, #10192e 75%);
            background-size: 38px 38px;
            background-position: 0 0, 0 19px, 19px -19px, -19px 0px;
            filter: blur(1.5px);
            opacity: 0.95;
        }
        .safety-mask-card {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: rgba(10, 15, 28, 0.92);
            border: 2px solid rgba(255, 187, 0, 0.45);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 187, 0, 0.25);
            padding: 36px 54px;
            border-radius: 18px;
            backdrop-filter: blur(14px);
            animation: pulseCard 2.5s infinite ease-in-out;
            text-align: center;
        }
        @keyframes pulseCard {
            0%, 100% { border-color: rgba(255, 187, 0, 0.45); box-shadow: 0 0 30px rgba(255, 187, 0, 0.2); }
            50% { border-color: rgba(255, 187, 0, 0.85); box-shadow: 0 0 55px rgba(255, 187, 0, 0.45); }
        }
        .safety-warn-icon {
            filter: drop-shadow(0 0 15px rgba(255, 187, 0, 0.6));
            animation: bounceWarn 1.8s infinite ease-in-out;
        }
        @keyframes bounceWarn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .safety-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
        }
        .safety-subtitle {
            color: #ffbb00;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
        }
        .safety-tip {
            color: #94a3b8;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <div id="status-overlay">
            <div class="spinner"></div>
            <span id="status-text">正在连接局域网 Vidu 数字人推流通道...</span>
        </div>
        <!-- 应急安全审核大方块马赛克遮罩 -->
        <div id="safety-mask-overlay" class="safety-mask hidden" style="display: none;">
            <div class="safety-mask-pattern"></div>
            <div class="safety-mask-card">
                <div class="safety-warn-icon">
                    <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="#ffbb00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="safety-title">安全审核中</div>
                <div class="safety-subtitle">STREAM SAFETY AUDIT IN PROGRESS</div>
                <div class="safety-tip">⚠️ 触发平台应急安全审核机制 · 画面及声音已屏蔽</div>
            </div>
        </div>
    </div>

    <script>
        const videoEl = document.getElementById('remote-video');
        const statusOverlay = document.getElementById('status-overlay');
        const statusText = document.getElementById('status-text');

        const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProto}//${location.host}/?role=obs`;

        let pc = null;
        let ws = null;
        let myClientId = null;
        let iceQueue = [];
        let inboundStream = null;
        let isMasked = false;

        function applySafetyMask(enabled) {
            isMasked = !!enabled;
            const maskEl = document.getElementById('safety-mask-overlay');
            if (maskEl) {
                if (isMasked) {
                    maskEl.classList.remove('hidden');
                    maskEl.style.display = 'flex';
                    videoEl.muted = true;
                    videoEl.style.opacity = '0';
                    console.log('[OBS] ⚠️ 应急安全审核遮罩已激活，画面与声音已屏蔽');
                } else {
                    maskEl.classList.add('hidden');
                    maskEl.style.display = 'none';
                    videoEl.muted = false;
                    videoEl.style.opacity = '1';
                    console.log('[OBS] 🟢 安全审核已解除，恢复正常推流');
                }
            }
        }

        // 页面初始化时主动查询当前安全审核状态
        fetch('/api/safety-mask').then(r => r.json()).then(data => {
            if (data && data.active) {
                applySafetyMask(true);
            }
        }).catch(() => {});

        function markStreamLive() {
            if (videoEl.videoWidth > 0) {
                statusOverlay.classList.add('hidden');
            }
        }

        videoEl.onloadedmetadata = () => {
            console.log(`[OBS] 视频元数据已加载！分辨率: ${videoEl.videoWidth}x${videoEl.videoHeight}`);
            markStreamLive();
        };

        videoEl.onplaying = () => {
            console.log('[OBS] 视频流已开始播放！');
            markStreamLive();
        };

        videoEl.ontimeupdate = () => {
            if (videoEl.currentTime > 0) {
                markStreamLive();
            }
        };

        function connectWS() {
            console.log(`[OBS] 正在连接中继 WebSocket: ${wsUrl}`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('[OBS] WebSocket 已经连接到局域网中继服务！');
                statusText.innerText = '已接入中继，等待数字人开播推流...';
            };

            ws.onmessage = async (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'init') {
                        myClientId = data.clientId;
                        console.log(`[OBS] 已分配唯一客户端识别码: [${myClientId}]`);
                        if (data.isSafetyMaskActive) {
                            applySafetyMask(true);
                        }
                    } else if (data.type === 'safety-mask') {
                        applySafetyMask(data.enabled);
                    } else if (data.type === 'signal-offer') {
                        if (data.clientId && myClientId && data.clientId !== myClientId) {
                            return; // 忽略发往其他客户端的 offer
                        }
                        console.log('[OBS] 收到 WebRTC Offer，正在建立媒体连接...');
                        statusText.innerText = '正在握手建立音视频流...';
                        await handleOffer(data.offer);
                    } else if (data.type === 'signal-ice') {
                        if (data.clientId && myClientId && data.clientId !== myClientId) {
                            return;
                        }
                        if (data.candidate) {
                            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                                try {
                                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                                } catch(e) {
                                    console.warn('[OBS] 添加 ICE 异常:', e);
                                }
                            } else {
                                iceQueue.push(data.candidate);
                            }
                        }
                    }
                } catch (e) {
                    console.error('[OBS] 处理信令异常:', e);
                }
            };

            ws.onclose = () => {
                console.log('[OBS] WebSocket 断开，2.5秒后重连...');
                statusOverlay.classList.remove('hidden');
                statusText.innerText = '中继服务连接断开，正在尝试重连...';
                setTimeout(connectWS, 2500);
            };

            ws.onerror = (err) => {
                console.error('[OBS] WebSocket 错误:', err);
            };
        }

        async function handleOffer(offer) {
            if (pc) {
                try { pc.close(); } catch(e) {}
            }

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });
            window.pc = pc;
            iceQueue = [];
            inboundStream = new MediaStream();

            pc.ontrack = (event) => {
                console.log('[OBS] 成功接收媒体流轨道:', event.track.kind, event.track.label);
                inboundStream.addTrack(event.track);

                if (videoEl.srcObject !== inboundStream) {
                    videoEl.srcObject = inboundStream;
                }

                // 确保音频正常开启（若处于安全审核中则保持静音）
                videoEl.muted = !!isMasked;
                videoEl.volume = 1.0;
                videoEl.play().catch(e => {
                    console.warn('[OBS] 自动播放被拦截，先静音起播随后恢复音量:', e);
                    videoEl.muted = true;
                    videoEl.play().then(() => {
                        videoEl.muted = false;
                    });
                });

                markStreamLive();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'signal-ice',
                        clientId: myClientId,
                        candidate: event.candidate
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                console.log('[OBS] WebRTC 连接状态:', pc.connectionState);
                if (pc.connectionState === 'connected') {
                    statusText.innerText = '音视频流传输中...';
                }
            };

            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            // 冲刷队列中的 ICE 候选地址
            for (const cand of iceQueue) {
                try {
                    await pc.addIceCandidate(new RTCIceCandidate(cand));
                } catch(e) {}
            }
            iceQueue = [];

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            ws.send(JSON.stringify({
                type: 'signal-answer',
                clientId: myClientId,
                answer: answer
            }));
            console.log('[OBS] 已向宿主发送 Answer，音视频流即将呈现');
        }

        connectWS();
    </script>
</body>
</html>
